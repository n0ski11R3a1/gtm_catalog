<nav class="glass-tabbar" id="glassTabbar">
    <a href="{{ url_for('home') }}" class="tab-item{% if request.endpoint == 'home' %} active{% endif %}"
       onclick="if(window.setGalleryModePreference)setGalleryModePreference('list')" aria-label="List view">
        <i class="bi bi-shop"></i>
        <span class="tab-label">List</span>
    </a>

    <a href="{{ url_for('gallery_home') }}" class="tab-item{% if request.endpoint in ('gallery_home', 'gallery_category') %} active{% endif %}"
       onclick="if(window.setGalleryModePreference)setGalleryModePreference('gallery')" aria-label="Gallery view">
        <i class="bi bi-images"></i>
        <span class="tab-label">Gallery</span>
    </a>

    <button type="button" class="tab-item" onclick="openOrderPanel()" aria-label="Open order list">
        <span class="tab-icon-wrap">
            <i class="bi bi-cart3"></i>
            <span id="cartBadge" class="cart-badge" style="display:none;">0</span>
        </span>
        <span class="tab-label">Cart</span>
    </button>

    {% if session.get('admin') %}
    <a href="{{ url_for('admin') }}" class="tab-item" aria-label="Admin Dashboard">
        <i class="bi bi-speedometer2"></i>
        <span class="tab-label">Admin</span>
    </a>
    {% else %}
    <a href="{{ url_for('login') }}" class="tab-item" aria-label="Admin Login">
        <i class="bi bi-shield-lock"></i>
        <span class="tab-label">Admin</span>
    </a>
    {% endif %}
</nav>
